# WorkReport HR-Pro Nginx 反向代理配置（含 HTTPS）
# 用途：把外部 80/443 端口的请求转发到后端的 8899 端口

# ============ HTTP 80 端口：自动跳转到 HTTPS ============
server {
    listen 80;
    server_name workreporthr.hrlyit.com;
    # 全部请求 301 跳转到 https
    return 301 https://$host$request_uri;
}

# ============ HTTPS 443 端口：正式服务 ============
server {
    listen 443 ssl;
    server_name workreporthr.hrlyit.com;

    # SSL 证书（运维申请证书后，把路径改到实际位置）
    ssl_certificate     /etc/nginx/ssl/workreporthr.hrlyit.com.pem;
    ssl_certificate_key /etc/nginx/ssl/workreporthr.hrlyit.com.key;

    # 现代安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传附件大小限制（周报附件可能较大，放宽到 50M）
    client_max_body_size 50m;

    # 前端静态资源（字体、图片等）
    location /static/ {
        alias /opt/workreport/src/frontend/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 其余请求转发给 FastAPI（uvicorn 8899 端口）
    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接（AI 接口可能耗时较长）
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
