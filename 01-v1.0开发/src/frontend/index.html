<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkReport HR-Pro · 工作汇报</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f5f7;color:#333;line-height:1.6}

.topbar{background:linear-gradient(135deg,#5b21b6,#7c3aed,#a855f7);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar .logo{font-size:17px;font-weight:700}
.topbar .user{font-size:13px;opacity:.95;display:flex;align-items:center;gap:8px}
.topbar .user .avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;background:rgba(255,255,255,.2)}

.container{max-width:1280px;margin:0 auto;padding:16px}

.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:20px 0}
.role-card{background:#fff;border:2px solid #eee;border-radius:12px;padding:20px;cursor:pointer;text-align:center;transition:.2s}
.role-card:hover{border-color:#7c3aed;background:#faf8ff}
.role-card .avatar{width:46px;height:46px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700}
.role-card .name{font-size:15px;font-weight:700}
.role-card .info{font-size:11px;color:#888;margin-top:2px}

.nav{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.nav-btn{padding:7px 18px;border-radius:18px;border:1px solid #e0e0e0;background:#fff;font-size:13px;cursor:pointer;color:#555;transition:.2s}
.nav-btn.active{background:#7c3aed;color:#fff;border-color:#7c3aed}

.card{background:#fff;border-radius:14px;padding:18px 22px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h2{font-size:15px;font-weight:700;margin-bottom:14px;color:#1a1a1a}

.st{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px;white-space:nowrap}
.st-done{background:#dcfce7;color:#16a34a}
.st-doing{background:#dbeafe;color:#2563eb}
.st-warn{background:#fef9c3;color:#ca8a04}
.st-delay{background:#ffedd5;color:#ea580c}
.st-stop{background:#fee2e2;color:#dc2626}

.tag{font-size:10px;padding:2px 7px;border-radius:7px;font-weight:600;white-space:nowrap}
.tag-high{background:#fee2e2;color:#dc2626}
.tag-mid{background:#fef3c7;color:#b45309}
.tag-low{background:#f1f5f9;color:#64748b}
.tag-cat-key{background:#ede9fe;color:#6d28d9}
.tag-cat-self{background:#dbeafe;color:#1d4ed8}
.tag-cat-normal{background:#f1f5f9;color:#64748b}
.tag-cum{background:#ede9fe;color:#6d28d9}

/* 表格形式周报 */
.table-wrap{overflow-x:auto;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
table.report{width:100%;border-collapse:collapse;min-width:1200px}
table.report th{background:#f7f5ff;color:#6d28d9;font-size:12px;font-weight:700;padding:12px 12px;text-align:left;border-bottom:2px solid #ede9fe;white-space:nowrap;position:sticky;top:0}
table.report td{padding:12px;border-bottom:1px solid #f0f0f0;font-size:13px;vertical-align:top}
table.report tr:hover td{background:#faf9ff}
.col-name{min-width:220px}
.col-goal{min-width:150px}
.col-lastweek{min-width:150px}
.col-progress{min-width:220px}
.col-support{min-width:170px}
.col-cum{min-width:150px}
table.report td textarea{width:100%;border:1px solid #eee;border-radius:6px;padding:7px 9px;font-size:12px;font-family:inherit;resize:vertical;background:#fbfbfb;display:block}
table.report td textarea:focus{border-color:#7c3aed;outline:none;background:#fff}
.cum-line{display:flex;align-items:center;gap:5px;font-size:11px;color:#6d28d9;margin:3px 0;white-space:nowrap}
.cum-line input{width:52px;padding:4px 6px;border:1px solid #d5ccff;border-radius:5px;font-size:12px;text-align:center}
.cum-line .cum-total{font-weight:700}
.no-cum{color:#ccc;font-size:12px}

/* 附件 */
.att-area{margin-top:6px}
.att-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.att-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:2px 8px;text-decoration:none}
.att-link:hover{background:#dbeafe}
.att-btn{font-size:11px;color:#6d28d9;background:none;border:1px dashed #c4b5fd;border-radius:6px;padding:3px 10px;cursor:pointer}
.att-btn:hover{background:#f5f3ff}

/* 工作事项概览 */
.overview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.overview-head h2{margin:0}
.ov-list{display:flex;flex-wrap:wrap;gap:8px}
.ov-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:#faf9ff;border:1px solid #eee;border-radius:18px;padding:5px 12px;cursor:pointer}
.ov-chip:hover{border-color:#7c3aed}

.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit}
.form-group textarea{min-height:64px;resize:vertical}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:#7c3aed;outline:none}

.btn{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.btn-primary{background:#7c3aed;color:#fff}
.btn-outline{background:#fff;color:#7c3aed;border:2px solid #7c3aed}
.btn-gray{background:#f0f0f0;color:#666}
.btn-sm{padding:4px 12px;font-size:11px}
.btn-group{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.metric{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.metric .m-label{font-size:12px;color:#888}
.metric .m-value{font-size:24px;font-weight:700;margin-top:2px}
.section-title{font-size:15px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.section-title .bar{width:4px;height:16px;background:#7c3aed;border-radius:2px}
.goal-block{margin-bottom:12px}
.goal-head{font-size:13px;font-weight:700;color:#6d28d9;padding:10px 14px;background:#f7f5ff;border-radius:10px;margin-bottom:8px}
.key-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f5f5f5;flex-wrap:wrap}
.key-item .ki-name{font-weight:600;font-size:13px}
.key-item .ki-cum{margin-left:auto;font-size:12px;color:#6d28d9;font-weight:600}
.member-group{margin-bottom:10px}
.member-head{font-size:13px;font-weight:700;color:#6d28d9;padding:8px 12px;background:#f7f5ff;border-radius:8px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.member-head .m-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.todo-item .dot{width:7px;height:7px;border-radius:50%;margin-top:7px;flex-shrink:0}

.hidden{display:none}
.empty{text-align:center;padding:30px;color:#999;font-size:14px}

/* 登录页 */
.login-wrap{max-width:400px;margin:40px auto;padding:20px}
.login-card{background:#fff;border-radius:16px;padding:32px 30px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.login-card .logo{font-size:20px;font-weight:700;color:#5b21b6;text-align:center;margin-bottom:4px}
.login-card .sub{font-size:12px;color:#999;text-align:center;margin-bottom:24px}
.login-card .err{font-size:12px;color:#dc2626;background:#fee2e2;border-radius:8px;padding:8px 12px;margin-bottom:12px;display:none}
.login-card input{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:12px}
.login-card input:focus{border-color:#7c3aed;outline:none}
.login-card .btn{width:100%;padding:11px;font-size:14px}
.login-card .tip{font-size:11px;color:#bbb;text-align:center;margin-top:14px}

.logout-btn{font-size:12px;color:#fff;background:rgba(255,255,255,.2);border:none;border-radius:6px;padding:4px 10px;cursor:pointer}
.logout-btn:hover{background:rgba(255,255,255,.3)}

@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.topbar{padding:12px 16px}.container{padding:12px}}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">WorkReport HR-Pro</span>
  <div class="user" id="headerUser"><span class="avatar" id="headerAvatar"></span><span id="headerName"></span><button class="logout-btn hidden" id="logoutBtn" onclick="logout()">退出</button></div>
</div>

<div class="container">
  <div class="nav hidden" id="nav">
    <button class="nav-btn active" data-page="report">填写周报</button>
    <button class="nav-btn hidden" data-page="dashboard" id="navDash">汇报视图</button>
  </div>

  <div id="page-select">
    <div class="login-wrap">
      <div class="login-card">
        <div class="logo">WorkReport HR-Pro</div>
        <div class="sub">请登录后填写本周工作汇报</div>
        <div class="err" id="loginErr"></div>
        <input id="loginUsername" placeholder="账号" autocomplete="username">
        <input id="loginPassword" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="btn btn-primary" onclick="doLogin()">登 录</button>
        <div class="tip">默认账号：成员姓名拼音（如李微微 lweiwei）· 密码 123456</div>
      </div>
    </div>
  </div>

  <!-- 周报填写（表格形式） -->
  <div id="page-report" class="hidden">
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <h2 style="margin:0">本周工作汇报 <span style="font-size:12px;color:#888;font-weight:400" id="weekLabel"></span></h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="submitReview()">提交前 AI 审阅</button>
        <button class="btn btn-outline btn-sm" onclick="saveDraft()">保存草稿</button>
        <button class="btn btn-primary btn-sm" onclick="submitReport()">提交周报</button>
      </div>
    </div>

    <!-- 我的工作事项概览（表格上方） -->
    <div class="card">
      <div class="overview-head">
        <h2>我的工作事项概览</h2>
        <button class="btn btn-primary btn-sm" onclick="showAddItem()">+ 新增事项</button>
      </div>
      <div class="ov-list" id="itemsOverview"></div>
      <div id="addItemForm" class="hidden" style="margin-top:16px;padding-top:16px;border-top:1px solid #eee">
        <h3 style="font-size:14px;margin-bottom:12px">新增工作事项</h3>
        <div class="form-group"><label>事项名称</label><input id="niName" placeholder="输入工作事项名称"></div>
        <div class="form-group"><label>分类</label><select id="niCategory"><option>年度重点工作</option><option>自主专项工作</option><option>常规工作</option></select></div>
        <div class="form-group"><label>重要性</label><select id="niImportance"><option value="高">高</option><option value="中" selected>中</option><option value="低">低</option></select></div>
        <div class="form-group"><label>关联年度目标</label><select id="niGoal"></select></div>
        <div class="form-group"><label>预计完成时间</label><input id="niDue" type="date"></div>
        <div class="form-group"><label>是否累计制工作</label><select id="niCum" onchange="toggleCum()"><option value="0">否（一次性项目）</option><option value="1">是（持续累计）</option></select></div>
        <div class="form-group hidden" id="niCumMetricsWrap">
          <label>累计指标（每行一个，格式：指标key|指标名|单位）</label>
          <textarea id="niCumMetrics" placeholder="offer|Offer数|个&#10;onboard|入职数|人"></textarea>
          <div style="font-size:11px;color:#999;margin-top:4px">常用：访谈填 count|访谈人次|人次；培训填 times|培训场次|场</div>
        </div>
        <div class="form-group"><label>工作目标</label><textarea id="niDesc" placeholder="这个事项要达成什么目标"></textarea></div>
        <div class="btn-group"><button class="btn btn-primary" onclick="addItem()">确认添加</button><button class="btn btn-gray" onclick="hideAddItem()">取消</button></div>
      </div>
    </div>

    <div class="card hidden" id="aiPanel"></div>

    <div class="table-wrap">
      <table class="report">
        <thead>
          <tr>
            <th class="col-name">工作事项</th>
            <th class="col-goal">工作目标</th>
            <th class="col-lastweek">上周进展情况</th>
            <th class="col-progress">本周进展及下阶段计划</th>
            <th class="col-support">所需支持 / 待决策</th>
            <th class="col-cum">本周累计数据</th>
          </tr>
        </thead>
        <tbody id="reportBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 汇报视图 -->
  <div id="page-dashboard" class="hidden">
    <div class="metrics" id="dashMetrics"></div>
    <div id="dashContent"></div>
  </div>
</div>

<script>
let currentUser = null, allUsers = [], allGoals = [], allItems = [];
const WEEK_START = (() => { const d=new Date(); const day=d.getDay(); const diff=d.getDate()-day+(day===0?-6:1); return new Date(d.setDate(diff)).toISOString().split('T')[0]; })();
const ST_CLASS = {'已完成':'st-done','进行中':'st-doing','临期':'st-warn','延期':'st-delay','暂停':'st-stop','终止':'st-stop'};
const ST_ICON = {'已完成':'✓','进行中':'●','临期':'⚠','延期':'⏰','暂停':'⛔','终止':'⛔'};

async function init(){
  document.getElementById('weekLabel').textContent = `本周: ${WEEK_START}`;
  allGoals = await (await fetch('/api/goals')).json();
  const goalSel = document.getElementById('niGoal');
  goalSel.innerHTML = '<option value="">不关联目标</option>' + allGoals.map(g=>`<option value="${g.id}">${g.name} (${g.weight}%)</option>`).join('');
  // 已登录则直接进入，否则显示登录页
  const saved = sessionStorage.getItem('wr_user');
  if(saved){ enterApp(JSON.parse(saved)); }
}

async function doLogin(){
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!username || !password){ showLoginErr('请输入账号和密码'); return; }
  const res = await (await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})})).json();
  if(!res.success){ showLoginErr(res.message||'登录失败'); return; }
  sessionStorage.setItem('wr_user', JSON.stringify(res.user));
  enterApp(res.user);
}

function showLoginErr(msg){
  const e = document.getElementById('loginErr');
  e.textContent = msg; e.style.display = 'block';
}

function enterApp(user){
  currentUser = user;
  document.getElementById('page-select').classList.add('hidden');
  document.getElementById('headerAvatar').textContent = currentUser.name[0];
  document.getElementById('headerAvatar').style.background = currentUser.avatar_color;
  document.getElementById('headerName').textContent = `${currentUser.name} (${currentUser.role})`;
  document.getElementById('logoutBtn').classList.remove('hidden');
  document.getElementById('nav').classList.remove('hidden');
  if(currentUser.is_manager) document.getElementById('navDash').classList.remove('hidden');
  switchPage('report');
}

function logout(){
  sessionStorage.removeItem('wr_user');
  location.reload();
}

document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>switchPage(b.dataset.page)));

function switchPage(page){
  ['report','dashboard'].forEach(p=>document.getElementById('page-'+p).classList.add('hidden'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+page).classList.remove('hidden');
  document.querySelector(`[data-page="${page}"]`).classList.add('active');
  if(page==='report') loadReport();
  if(page==='dashboard') loadDashboard();
}

function stBadge(status){ return `<span class="st ${ST_CLASS[status]||'st-doing'}">${ST_ICON[status]||'●'} ${status}</span>`; }
function catTag(cat){ const m={'年度重点工作':'tag-cat-key','自主专项工作':'tag-cat-self','常规工作':'tag-cat-normal'}; return `<span class="tag ${m[cat]||'tag-cat-normal'}">${cat}</span>`; }
function impTag(imp){ const m={'高':'tag-high','中':'tag-mid','低':'tag-low'}; return `<span class="tag ${m[imp]||'tag-mid'}">${imp||'中'}</span>`; }

// ========== 周报填写（表格） ==========
function goalFoldHtml(d){
  let content;
  if(currentUser.is_manager){
    const opts = allGoals.map(g=>`<option value="${g.id}" ${d.goal_id===g.id?'selected':''}>${g.name} (${g.weight}%)</option>`).join('');
    content = `<select class="goal-select" data-item-id="${d.work_item_id}" onchange="changeGoal(this)" style="width:100%;font-size:12px;color:#6d28d9;border:1px solid #d5ccff;border-radius:6px;padding:4px 6px">${opts}</select>`;
  } else {
    content = `<div style="font-size:12px;color:#6d28d9">🎯 ${d.goal_name||'未对齐目标'}</div>`;
  }
  return `<details style="margin-top:5px"><summary style="cursor:pointer;font-size:11px;color:#6d28d9;font-weight:600">▽ 对齐年度目标</summary><div style="margin-top:6px">${content}</div></details>`;
}

async function loadReport(){
  const data = await (await fetch(`/api/reports/my-progress?user_id=${currentUser.id}&week_start=${WEEK_START}`)).json();
  // 本周所有附件（按事项分组）
  const atts = await (await fetch(`/api/attachments?week_start=${WEEK_START}`)).json();
  const attMap = {};
  atts.forEach(a=>{ (attMap[a.work_item_id]=attMap[a.work_item_id]||[]).push(a); });

  // 1. 工作事项概览
  const ovBox = document.getElementById('itemsOverview');
  if(!data.length){ ovBox.innerHTML = '<div style="font-size:12px;color:#999">暂无工作事项，点击右上角"新增事项"添加</div>'; }
  else{
    ovBox.innerHTML = data.map(d=>`
      <span class="ov-chip">${d.work_item_name} ${stBadge(d.status)}</span>`).join('');
  }

  // 2. 明细表格
  const body = document.getElementById('reportBody');
  if(!data.length){ body.innerHTML = '<tr><td colspan="6" class="empty">暂无工作事项，请先新增事项</td></tr>'; return; }
  body.innerHTML = data.map(d => {
    let cumHtml = '';
    if(d.is_cumulative && d.cum_metrics && d.cum_metrics.length){
      cumHtml = d.cum_metrics.map(m => {
        const v = (d.cum_data && d.cum_data[m.key]!==undefined) ? d.cum_data[m.key] : '';
        const total = (d.cum_value && d.cum_value[m.key]!==undefined) ? d.cum_value[m.key] : 0;
        return `<div class="cum-line">${m.label}<input type="number" min="0" class="cum-input" data-metric="${m.key}" value="${v}">${m.unit}<span class="cum-total">累计 ${total}</span></div>`;
      }).join('');
    } else {
      cumHtml = '<span class="no-cum">—</span>';
    }
    const itemAtts = attMap[d.work_item_id] || [];
    const attHtml = `
      <div class="att-area">
        ${itemAtts.length?`<div class="att-list">${itemAtts.map(a=>`<a class="att-link" href="/api/attachments/${a.id}/download" target="_blank">📎 ${a.filename}</a>`).join('')}</div>`:''}
        <button class="att-btn" data-item-id="${d.work_item_id}" onclick="uploadAttachment(this)">📎 上传附件</button>
      </div>`;
    return `<tr data-item-id="${d.work_item_id}">
      <td class="col-name">
        <div style="font-weight:700">${d.work_item_name}</div>
        <div style="margin-top:3px">${catTag(d.category)} ${impTag(d.importance)} ${stBadge(d.status)} ${d.is_cumulative?'<span class="tag tag-cum">累计制</span>':''}</div>
        <div style="font-size:11px;color:#888;margin-top:3px">${d.due_date?'截止 '+d.due_date:''}</div>
        ${goalFoldHtml(d)}
        ${attHtml}
      </td>
      <td class="col-goal">${d.target_desc||'<span style="color:#ccc">—</span>'}</td>
      <td class="col-lastweek"><div style="font-size:12px;color:#666">${d.last_week_progress||'<span style="color:#ccc">无</span>'}</div></td>
      <td class="col-progress"><textarea class="p-input" data-field="progress" placeholder="本周进展 + 下阶段计划">${d.progress||''}</textarea></td>
      <td class="col-support"><textarea class="p-input" data-field="blockers" placeholder="需要什么支持 / 待决策事项">${d.blockers||''}</textarea></td>
      <td class="col-cum">${cumHtml}</td>
    </tr>`;
  }).join('');
  alignTextareas();
}

// 让文本框底部与"工作事项"列（含对齐目标折叠）下部对齐
function alignTextareas(){
  document.querySelectorAll('#reportBody tr[data-item-id]').forEach(tr=>{
    const nameCell = tr.querySelector('.col-name');
    const h = nameCell ? nameCell.offsetHeight - 24 : 0;
    tr.querySelectorAll('textarea').forEach(ta=>{ ta.style.height = Math.max(h, 60) + 'px'; });
  });
}

async function uploadAttachment(btn){
  const itemId = btn.dataset.itemId;
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file){ return; }
    const fd = new FormData();
    fd.append('file', file);
    fd.append('work_item_id', itemId);
    fd.append('week_start', WEEK_START);
    fd.append('uploaded_by', currentUser.id);
    const r = await fetch('/api/attachments', {method:'POST', body:fd});
    const res = await r.json();
    if(res.id){ loadReport(); }
    else { alert(res.message||'上传失败'); }
  };
  input.click();
}

async function changeGoal(sel){
  const itemId = parseInt(sel.dataset.itemId);
  const goalId = sel.value ? parseInt(sel.value) : null;
  await fetch(`/api/items/${itemId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal_id:goalId})});
}

function collectData(){
  const entries = [];
  document.querySelectorAll('#reportBody tr[data-item-id]').forEach(tr=>{
    const id = parseInt(tr.dataset.itemId);
    const progress = tr.querySelector('[data-field="progress"]').value;
    const blockers = tr.querySelector('[data-field="blockers"]').value;
    const cum = {};
    tr.querySelectorAll('.cum-input').forEach(inp=>{ if(inp.value!=='') cum[inp.dataset.metric] = parseInt(inp.value); });
    entries.push({work_item_id:id, progress, next_plan:'', blockers, cum_data: JSON.stringify(cum)});
  });
  return entries;
}

async function saveDraft(){
  const entries = collectData();
  await fetch(`/api/reports/save-draft?user_id=${currentUser.id}&week_start=${WEEK_START}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entries})});
  alert('草稿已保存');
}

async function submitReview(){
  await saveDraft();
  const data = await (await fetch('/api/agent/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:currentUser.id,week_start:WEEK_START})})).json();
  const panel = document.getElementById('aiPanel');
  panel.classList.remove('hidden');
  if(!data.suggestions.length){ panel.innerHTML='<h2>AI 审阅完成</h2><p style="color:#16a34a">内容看起来不错，可以提交。</p>'; return; }
  panel.innerHTML = '<h2>AI 审阅建议（'+data.total_suggestions+'条）</h2>' + data.suggestions.map(s=>`<div class="todo-item"><span class="dot" style="background:#7c3aed"></span><div><b>${s.work_item_name}</b>：${s.message}</div></div>`).join('');
}

async function submitReport(){
  const entries = collectData();
  const r = await fetch(`/api/reports/submit?user_id=${currentUser.id}&week_start=${WEEK_START}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entries})});
  const res = await r.json();
  alert(res.message||'提交成功');
}

// ========== 工作事项 ==========
function showAddItem(){ document.getElementById('addItemForm').classList.remove('hidden'); }
function hideAddItem(){ document.getElementById('addItemForm').classList.add('hidden'); }
function toggleCum(){ document.getElementById('niCumMetricsWrap').classList.toggle('hidden', document.getElementById('niCum').value!=='1'); }

async function addItem(){
  const name = document.getElementById('niName').value.trim();
  if(!name){ alert('请输入事项名称'); return; }
  const isCum = parseInt(document.getElementById('niCum').value);
  let cumMetrics = '[]';
  if(isCum){
    const lines = document.getElementById('niCumMetrics').value.trim().split('\n').filter(l=>l.trim());
    cumMetrics = JSON.stringify(lines.map(l=>{ const p=l.split('|'); return {key:(p[0]||'').trim(), label:(p[1]||'').trim(), unit:(p[2]||'').trim()}; }));
  }
  const goalId = document.getElementById('niGoal').value;
  await fetch('/api/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    name, category:document.getElementById('niCategory').value, importance:document.getElementById('niImportance').value,
    owner_id:currentUser.id, goal_id:goalId?parseInt(goalId):null, target_desc:document.getElementById('niDesc').value,
    due_date:document.getElementById('niDue').value, is_cumulative:isCum, cum_metrics:cumMetrics
  })});
  document.getElementById('niName').value=''; document.getElementById('niDesc').value='';
  hideAddItem(); loadReport();
}

// ========== 汇报视图 ==========
async function loadDashboard(){
  const d = await (await fetch(`/api/agent/dashboard?week_start=${WEEK_START}`)).json();
  const km = d.key_metrics;
  const metrics = [
    {label:'累计入职', value:km.onboard||0, color:'#16a34a'},
    {label:'累计 Offer', value:km.offer||0, color:'#2563eb'},
    {label:'累计访谈人次', value:km.count||0, color:'#7c3aed'},
    {label:'进行中事项', value:d.members.reduce((s,m)=>s+m.items.length,0), color:'#f97316'},
  ];
  document.getElementById('dashMetrics').innerHTML = metrics.map(m=>`<div class="metric"><div class="m-label">${m.label}</div><div class="m-value" style="color:${m.color}">${m.value}</div></div>`).join('');

  let html = '<div class="section-title"><span class="bar"></span>重点工作项目</div>';
  const goalNames = {};
  allGoals.forEach(g=>goalNames[g.id]=g.name);
  Object.entries(d.goals).forEach(([gid, items])=>{
    const gname = goalNames[gid] || '未挂目标';
    html += `<div class="goal-block"><div class="goal-head">${gname}</div>`;
    items.forEach(it=>{
      const cumTxt = it.is_cumulative && it.cum_value ? Object.entries(it.cum_value).map(([k,v])=>`${k}:${v}`).join(' ') : '';
      html += `<div class="key-item"><span class="ki-name">${it.name}</span>${impTag(it.importance)}${stBadge(it.status)}<span style="font-size:11px;color:#888">${it.owner_name}${it.due_date?' · 截止'+it.due_date:''}</span>${cumTxt?`<span class="ki-cum">${cumTxt}</span>`:''}</div>`;
    });
    html += '</div>';
  });

  html += '<div class="section-title"><span class="bar"></span>日常工作明细</div>';
  d.members.forEach(m=>{
    html += `<div class="member-group"><div class="member-head"><span class="m-avatar" style="background:${m.avatar_color}">${m.name[0]}</span>${m.name} · ${m.business_line||m.role}</div>`;
    m.items.forEach(it=>{
      const cumTxt = it.is_cumulative && it.cum_value ? Object.entries(it.cum_value).map(([k,v])=>`${k}:${v}`).join(' ') : '';
      html += `<div class="key-item"><span class="ki-name">${it.name}</span>${catTag(it.category)}${stBadge(it.status)}${cumTxt?`<span class="ki-cum">${cumTxt}</span>`:''}</div>`;
    });
    html += '</div>';
  });

  if(d.decisions.length){
    html += '<div class="section-title"><span class="bar"></span>需关注/决策事项</div>';
    d.decisions.forEach(x=>{ html += `<div class="todo-item"><span class="dot" style="background:#ef4444"></span><div><b>${x.work_item_name}</b>：${x.content}</div></div>`; });
  }

  document.getElementById('dashContent').innerHTML = html;
}

init();
</script>
